[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruleatlas-community"
version = "0.1.3"
description = "Vendor-neutral, evidence-aware search for public detection rules"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
ruleatlas = "ruleatlas.cli:main"

[tool.setuptools.package-data]
ruleatlas = ["sources.json", "static/*"]

[tool.setuptools.packages.find]
include = ["ruleatlas*"]
exclude = ["data*", "tests*", "docs*"]
